[package]
name = "wgpu-notan-test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
notan_core = { path = "../notan-patched/crates/notan_core" }
notan_app = { path = "../notan-patched/crates/notan_app" }
notan_macro = { path = "../notan-patched/crates/notan_macro" }
notan_graphics = { path = "../notan-patched/crates/notan_graphics" }
notan_glow = { path = "../notan-patched/crates/notan_glow" }
notan_web = { path = "../notan-patched/crates/notan_web" }
notan_log = { path = "../notan-patched/crates/notan_log" }

log = "0.4"
bytemuck = "1.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "console"
] }
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wgpu = { version = "28", features = ["webgl"] }
glow = "0.16"
downcast-rs = "2.0"
